name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build Signed Release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/release/app-release.apk SiAbsen-latest.apk

      - name: Publish ke GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release view latest --repo "$REPO" >/dev/null 2>&1 \
            || gh release create latest --repo "$REPO" \
                 --title "SiAbsen — APK Terbaru" \
                 --notes "Download **SiAbsen-latest.apk**, lalu install (Android 8+). Di-sign dengan debug key untuk keperluan testing."
          gh release upload latest SiAbsen-latest.apk --repo "$REPO" --clobber

      - name: Info download
        env:
          REPO: ${{ github.repository }}
        run: echo "APK tersedia di https://github.com/$REPO/releases/latest"
